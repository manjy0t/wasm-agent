[package]
name = "hal-on-demand"
version = "0.1.0"
edition = "2021"
description = "Persistent native execution host for an on-demand Wasm job agent"

[workspace]
exclude = ["orchestrator", "guest", "vendor/wasmhal", "benchmarks/guest"]

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rayon = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
wasmtime = { version = "=25.0.3", features = ["component-model"] }
wasmtime-wasi = "=25.0.3"
hal-runtime = { path = "vendor/wasmhal/hal-runtime" }
elastic-tee-hal = { path = "vendor/wasmhal" }

[[bin]]
name = "hal-on-demand"
path = "src/main.rs"

[[bin]]
name = "hal-agent-runner"
path = "src/runner_main.rs"
test = false
