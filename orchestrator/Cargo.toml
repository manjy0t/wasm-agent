[package]
name = "hal-orchestration-agent"
version = "1.0.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.41.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
hex = "0.4"
sha2 = "0.10"
hal-access-profile = { path = "../vendor/hal-access-profile" }

[profile.release]
opt-level = 3
lto = true
strip = true
